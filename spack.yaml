spack:
  view: /opt/view
  specs:
  - icon


  'compilers:':
  - compiler:
      spec: gcc@11.4.0
      paths:
        cc: /usr/bin/gcc-11
        cxx: /usr/bin/g++-11
        f77: /usr/bin/gfortran-11
        fc: /usr/bin/gfortran-11
      flags: {}
      operating_system: ubuntu24.04
      target: x86_64
      modules: []
      environment: {}
      extra_rpaths: []

  config:
    install_tree:
      root: /opt/spack
      padded_length: 128

  packages:
    all:
      require: target=x86_64

  mirrors:
    #my-mirror:
    #  url: oci://ghcr.io/blagithubuser/buildcache-blauser-blahost
    #  access_pair:
    #    id: blauser
    #    secret_variable: MY_OCI_TOKEN
    #  signed: false
    local-buildcache:
      url: oci://ghcr.io/agoscinski/spack-buildcache
      binary: true
      signed: false
      access_pair:
        id: GITHUB_USER # agoscinski
        secret_variable: GITHUB_TOKEN #  note developer settings -> token classics with "write:packages" permission and then add this token as secret to repo
