name: unittests

on:
  push:
    branches: [main]
  pull_request:
    # always

jobs:
  unittests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: alexgoes/icon-docker:icon2024.10-ubuntu24.04
    strategy:
      matrix:
        #python-version: ["3.10", "3.11", "3.12", "3.13"]
        python-version: ["3.12"]
        aiida-version: ['stable']
    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_DB: test_aiida
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      rabbitmq:
        image: rabbitmq:latest
        ports:
        - 5672:5672

    steps:
    # workaround https://github.com/actions/setup-python/issues/816#issuecomment-2100504677 need to change user in docker image?
    - name: Change ownership of /github/home
      run: | 
        echo "whoami $(whoami)"
        id 
        ls -l /github/
        chown -R $(whoami) /github/home
        ls -l /github/

    - uses: actions/checkout@v4

    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@v5
      with:
        python-version: ${{matrix.python-version}}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    #- name: Setup upterm session
    #  uses: lhotari/action-upterm@v1
    - name: Loading spack dep
      run: |
        spack load icon
        which icon

    - name: install Python dependencies
      run: |
        uv venv
        uv pip install --upgrade pip 
        uv pip install hatch

    - name: run unittests
      run: hatch test -py ${{matrix.python-version}} -n auto -v
